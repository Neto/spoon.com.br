<style>
[data-mac-only][hidden],[data-phone-only][hidden]{display:none!important}
.dl-phone{margin:32px 0 8px;padding:18px 20px;border-radius:18px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line)}
.dl-phone .dl-btn{margin:14px 0 0}
.dl-phone button.pill{font-size:17px;padding:11px 24px}
</style>
<script>
(function(){
  /* Phones and tablets cannot install a Mac app: offer to send the page to the Mac instead.
     An iPad reports itself as a Mac, but it has a touch screen. */
  var ua=navigator.userAgent||"";
  var phone=/iPhone|iPod|Android|Mobile/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)||(/iPad/.test(ua));
  if(phone){
    document.querySelectorAll("[data-mac-only]").forEach(function(el){el.hidden=true});
    document.querySelectorAll("[data-phone-only]").forEach(function(el){el.hidden=false});
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-send-link]");if(!b)return;
    var status=document.querySelector("[data-send-status]");
    var url=location.origin+location.pathname,title=document.title;
    function copied(ok){if(status)status.textContent=ok?"Link copied. Paste it in a message to yourself.":url}
    if(navigator.share){navigator.share({title:title,text:"Open this on your Mac:",url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){copied(true)},function(){copied(false)})}
    else copied(false);
  });
})();
</script>
